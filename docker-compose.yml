services:
  warehouse:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-reviewpilot}
      MARIADB_USER: ${MARIADB_USER:-rp}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-rppass}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
